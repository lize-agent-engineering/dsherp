# Business configuration extends the same single-stdio native context runtime.
- id: context-token-meter
  name: '@deepseek-ai/dsh-token-meter'
- id: context-compaction
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.02
    retainTokens: 2048
    maxTokens: 2048
    compactionRetries: 0
    auto: true
- id: model-authorization
  name: '../runtime/model-guard.cjs'
- id: context-base
  name: 'cordis:include'
  config:
    path: './dsh-context.yml'
- id: business-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: erp
    transport: stdio
    command: !!js process.env.DSHERP_PYTHON
    args: ['-m', 'dsherp.context_mcp']
    cwd: !!js process.env.DSHERP_PROJECT
    env:
      DSHERP_RUN_CONFIG: !!js process.env.DSHERP_RUN_CONFIG
    failOnStartupError: true
    toolCallTimeoutMs: 25000
    reconnect:
      enabled: false
