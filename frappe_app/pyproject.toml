[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsherp-bridge"
version = "0.1.0"
requires-python = ">=3.11"
description = "Restricted ERPNext read endpoints for dsherp validation"

[tool.setuptools.packages.find]
include = ["dsherp_bridge*", "dsherp_platform*"]

[tool.setuptools.package-data]
dsherp_bridge = ["modules.txt", "dsherp_bridge/page/**/*.json", "dsherp_bridge/page/**/*.js", "dsherp_bridge/report/**/*.json", "public/dist/*", "translations/*.csv"]

dsherp_platform = ["modules.txt", "platform/**/*.json", "platform/**/*.js"]
