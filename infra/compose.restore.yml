# The isolated stack a restore drill and a cold-start recovery run in.
#
# It has no ingress, no worker, no scheduler, no queue and no route out except the two fetch
# containers that pull the set from the repositories: a restored copy must not answer a user,
# claim a run, send mail or call a webhook. Every volume is its own, so `down -v` removes
# exactly what this drill created and nothing else.
#
# `dsherp-admin restore-drill` starts it with DSHERP_IMAGE_TAG set to the tag the backup set
# records, and refuses unless the running image id equals the id the set recorded.
name: ${DSHERP_RESTORE_PROJECT:-dsherp-restore}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
              "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=${DSHERP_DB_BUFFER_POOL:-512M}"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets: [db_root_password]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes: ["restore-db:/var/lib/mysql"]
    networks: [restore]
    logging: *logging

  redis-cache:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [restore]
    logging: *logging

  redis-queue:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [restore]
    logging: *logging

  backend:
    image: ${DSHERP_IMAGE_REGISTRY:?set DSHERP_IMAGE_REGISTRY}/dsherp-frappe:${DSHERP_IMAGE_TAG:?set DSHERP_IMAGE_TAG}
    pull_policy: if_not_present
    restart: "no"
    command: ["bench", "--help"]
    entrypoint: ["sh", "-c", "sleep infinity"]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -d /home/frappe/frappe-bench/sites"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes:
      - restore-sites:/home/frappe/frappe-bench/sites
      - restore-logs:/home/frappe/frappe-bench/logs
      - restore-fetched-data:/home/frappe/fetched/data:ro
      - restore-fetched-secrets:/home/frappe/fetched/secrets:ro
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [restore]
    logging: *logging

  # The only containers with a route out. Each fetches one half into its own volume, so the
  # identity that can read the dumps still cannot read the site_config copies; only the bench
  # sees both, and only read-only.
  restore-fetch-data:
    profiles: [fetch]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    user: "${DSHERP_AGENT_UID:-1000}:${DSHERP_AGENT_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    env_file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_storage_credentials
    secrets: [backup_repository_password]
    volumes:
      - restore-fetched-data:/fetched
      - restore-cache:/cache
    networks: [restore, provider]
    logging: *logging

  restore-fetch-secrets:
    profiles: [fetch]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    user: "${DSHERP_AGENT_UID:-1000}:${DSHERP_AGENT_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_SECRETS_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_secrets_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    env_file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_secrets_storage_credentials
    secrets: [backup_secrets_repository_password]
    volumes:
      - restore-fetched-secrets:/fetched
      - restore-cache:/cache
    networks: [restore, provider]
    logging: *logging

networks:
  # Nothing in the restored copy can reach anything; only the fetch containers get a route.
  restore: {internal: true}
  provider: {}

volumes:
  restore-db:
  restore-sites:
  restore-logs:
  restore-fetched-data:
  restore-fetched-secrets:
  restore-cache:

secrets:
  db_root_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/db_root_password
  backup_repository_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_repository_password
  backup_secrets_repository_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_secrets_repository_password
