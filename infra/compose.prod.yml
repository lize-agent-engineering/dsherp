# Production stack: one Linux host, images by release tag, no working copy anywhere.
# Render the ingress and the secrets with dsherp-admin before the first "up".
name: ${DSHERP_PROJECT:?set DSHERP_PROJECT}

x-frappe: &frappe
  image: ${DSHERP_IMAGE_REGISTRY:?set DSHERP_IMAGE_REGISTRY}/dsherp-frappe:${DSHERP_IMAGE_TAG:?set DSHERP_IMAGE_TAG}
  pull_policy: if_not_present
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci",
              "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=${DSHERP_DB_BUFFER_POOL:-1G}"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    secrets: [db_root_password]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes: ["db-data:/var/lib/mysql"]
    networks: [backplane]
    logging: *logging

  redis-cache:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "${DSHERP_REDIS_CACHE_MAXMEMORY:-256mb}",
              "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes: ["redis-cache-data:/data"]
    networks: [backplane]
    logging: *logging

  redis-queue:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    restart: unless-stopped
    # The queue must survive a restart; the cache may not.
    command: ["redis-server", "--maxmemory", "${DSHERP_REDIS_QUEUE_MAXMEMORY:-256mb}",
              "--maxmemory-policy", "noeviction", "--save", "60 1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    volumes: ["redis-queue-data:/data"]
    networks: [backplane]
    logging: *logging

  backend:
    <<: *frappe
    command: ["start.sh"]
    # The host worker claims runs and sends heartbeats over this loopback port with the
    # Site's service credentials. Docker only publishes ports for containers that sit on a
    # non-internal network, hence the extra `worker` network below; every other network
    # here is internal. Never bind this to anything but 127.0.0.1.
    ports: ["127.0.0.1:${DSHERP_BACKEND_LOOPBACK_PORT:-8000}:8000"]
    environment:
      GUNICORN_WORKERS: "${DSHERP_GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${DSHERP_GUNICORN_THREADS:-4}"
    healthcheck:
      # A tenant bench serves many Sites; an unknown Host is a 404 from a healthy
      # process, so only a transport failure or a 5xx counts as unhealthy.
      test: ["CMD", "python3", "-c",
             "import urllib.error,urllib.request,sys\ntry:\n sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/method/ping',timeout=5).status<500 else 1)\nexcept urllib.error.HTTPError as error:\n sys.exit(0 if error.code<500 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    volumes:
      - tenant-sites:/home/frappe/frappe-bench/sites
      - tenant-logs:/home/frappe/frappe-bench/logs
      # `bench drop-site` moves a retired Site (its final backup included) here; the
      # directory exists in the image owned by the bench user so the volume starts writable.
      - tenant-archive:/home/frappe/frappe-bench/archived
      # Backup sets staged by `dsherp-admin backup`: the three data pieces and the snapshot
      # here, the site_config copy in a volume of its own, so the two sync containers each
      # see one half and neither can read the other's.
      - tenant-backups:/home/frappe/backups
      - tenant-backup-secrets:/home/frappe/backup-secrets
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [backplane, site, agent, worker]
    logging: *logging

  scheduler:
    <<: *frappe
    # Liveness of the bench process itself; readiness has no port to probe.
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1 && grep -q bench /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["bench", "schedule"]
    volumes:
      - tenant-sites:/home/frappe/frappe-bench/sites
      - tenant-logs:/home/frappe/frappe-bench/logs
      - tenant-backups:/home/frappe/backups
    depends_on:
      db: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [backplane]
    logging: *logging

  queue:
    <<: *frappe
    # Liveness of the bench process itself; readiness has no port to probe.
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1 && grep -q bench /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes:
      - tenant-sites:/home/frappe/frappe-bench/sites
      - tenant-logs:/home/frappe/frappe-bench/logs
      - tenant-backups:/home/frappe/backups
    depends_on:
      db: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [backplane]
    logging: *logging

  frontend:
    <<: *frappe
    # The image entrypoint re-links sites/assets at start, which fails on the read-only
    # sites mount; the bench already owns that link. nginx-entrypoint.sh only renders and serves.
    entrypoint: []
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: backend:8000
      # Tenant Sites are addressed by host name; one entry point serves all of them.
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: ${DSHERP_EDGE_SUBNET:-10.90.0.0/24}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import socket,sys;s=socket.create_connection(('127.0.0.1',8080),3);s.close()"]
      interval: 15s
      timeout: 5s
      retries: 6
    volumes:
      - tenant-sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      backend: {condition: service_healthy}
    networks: [site, edge]
    logging: *logging

  platform-backend:
    <<: *frappe
    command: ["start.sh"]
    environment:
      FRAPPE_SITE: ${DSHERP_PLATFORM_SLUG}.${DSHERP_BASE_DOMAIN}
      GUNICORN_WORKERS: "${DSHERP_PLATFORM_GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "2"
    healthcheck:
      # One Site only, so the check goes all the way through to that Site's ping.
      test: ["CMD", "python3", "-c",
             "import os,urllib.request,sys;request=urllib.request.Request('http://127.0.0.1:8000/api/method/ping',headers={'Host':os.environ['FRAPPE_SITE']});sys.exit(0 if urllib.request.urlopen(request,timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites
      - platform-logs:/home/frappe/frappe-bench/logs
      # release archives the platform's pre-upgrade backup set here (see backend).
      - platform-archive:/home/frappe/frappe-bench/archived
      - platform-backups:/home/frappe/backups
      - platform-backup-secrets:/home/frappe/backup-secrets
    depends_on:
      db: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    # Deliberately not on the agent network: a run container must never reach the control plane.
    networks:
      backplane:
        aliases: ["${DSHERP_PLATFORM_SLUG:?set DSHERP_PLATFORM_SLUG}.${DSHERP_BASE_DOMAIN:?set DSHERP_BASE_DOMAIN}"]
      platform-site:
    logging: *logging

  platform-scheduler:
    <<: *frappe
    # Liveness of the bench process itself; readiness has no port to probe.
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1 && grep -q bench /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["bench", "schedule"]
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites
      - platform-logs:/home/frappe/frappe-bench/logs
      - platform-backups:/home/frappe/backups
    depends_on:
      db: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [backplane]
    logging: *logging

  platform-queue:
    <<: *frappe
    # Liveness of the bench process itself; readiness has no port to probe.
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1 && grep -q bench /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["bench", "worker", "--queue", "short,default,long"]
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites
      - platform-logs:/home/frappe/frappe-bench/logs
      - platform-backups:/home/frappe/backups
    depends_on:
      db: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
    networks: [backplane]
    logging: *logging

  platform-frontend:
    <<: *frappe
    # The image entrypoint re-links sites/assets at start, which fails on the read-only
    # sites mount; the bench already owns that link. nginx-entrypoint.sh only renders and serves.
    entrypoint: []
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: platform-backend:8000
      SOCKETIO: platform-backend:8000
      FRAPPE_SITE_NAME_HEADER: ${DSHERP_PLATFORM_SLUG}.${DSHERP_BASE_DOMAIN}
      UPSTREAM_REAL_IP_ADDRESS: ${DSHERP_EDGE_SUBNET:-10.90.0.0/24}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import socket,sys;s=socket.create_connection(('127.0.0.1',8080),3);s.close()"]
      interval: 15s
      timeout: 5s
      retries: 6
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      platform-backend: {condition: service_healthy}
    networks: [platform-site, edge]
    logging: *logging

  agent-egress:
    <<: *frappe
    entrypoint: []
    command: ["sh", "/opt/dsherp-agent-egress-entrypoint.sh"]
    mem_limit: 128m
    environment:
      DSHERP_PROVIDER_HOST: ${DSHERP_PROVIDER_HOST:-api.deepseek.com}
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import socket,sys;s=socket.create_connection(('127.0.0.1',8890),3);s.close()"]
      interval: 30s
      timeout: 5s
      retries: 5
    configs:
      - {source: agent_egress_conf, target: /opt/dsherp-agent-egress.conf}
      - {source: agent_egress_entrypoint, target: /opt/dsherp-agent-egress-entrypoint.sh}
    networks: [agent, provider]
    logging: *logging

  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    pull_policy: if_not_present
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # Defaults are the real thing; a host that already serves 80/443 for someone else
    # (a shared drill box) moves these, at the cost of ACME HTTP-01 which needs port 80.
    ports: ["${DSHERP_HTTP_PORT:-80}:80", "${DSHERP_HTTPS_PORT:-443}:443", "${DSHERP_HTTPS_PORT:-443}:443/udp"]
    healthcheck:
      # Port 80 only redirects to HTTPS and 443 needs a matching SNI, so a plain
      # HTTP probe cannot pass; the listener being open is the liveness signal.
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DSHERP_ACME_EMAIL: ${DSHERP_ACME_EMAIL:?set DSHERP_ACME_EMAIL}
    configs:
      - {source: caddyfile, target: /etc/caddy/Caddyfile}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: {condition: service_healthy}
      platform-frontend: {condition: service_healthy}
    networks: [edge, provider]
    logging: *logging

  # Off-site backup, one repository per container. `dsherp-admin backup-sync` runs these with
  # `compose run --rm`, so they are one-shots: no healthcheck, no restart, nothing to keep
  # alive. Each sees one half of every backup set (read-only) and holds one repository
  # password and one storage identity, so the credential that reads the dumps can never
  # decrypt the site_config copies.
  backup-sync-data:
    profiles: [ops]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    user: "${DSHERP_AGENT_UID}:${DSHERP_AGENT_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    env_file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_storage_credentials
    secrets: [backup_repository_password]
    volumes:
      - tenant-backups:/backups/tenant:ro
      - platform-backups:/backups/platform:ro
      - backup-cache:/cache
    networks: [provider]
    logging: *logging

  backup-sync-secrets:
    profiles: [ops]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    user: "${DSHERP_AGENT_UID}:${DSHERP_AGENT_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_SECRETS_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_secrets_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    env_file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_secrets_storage_credentials
    secrets: [backup_secrets_repository_password]
    volumes:
      - tenant-backup-secrets:/backups/tenant:ro
      - platform-backup-secrets:/backups/platform:ro
      - backup-cache:/cache
    networks: [provider]
    logging: *logging

networks:
  # Databases and queues; no route out of the host.
  backplane: {internal: true}
  # Front end to tenant backend, and front end to platform backend, kept apart.
  site: {internal: true}
  platform-site: {internal: true}
  # Run containers reach exactly two things here: the tenant backend and the egress proxy.
  agent: {internal: true}
  # Caddy to the two front ends; pinned so the front ends can trust it for the real client IP.
  edge: {internal: true, ipam: {config: [{subnet: "${DSHERP_EDGE_SUBNET:-10.90.0.0/24}"}]}}
  # The only networks with a default route: provider for Caddy/ACME and the egress proxy,
  # worker so the tenant backend can publish its loopback port to the host worker.
  provider: {}
  worker: {}

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  tenant-sites:
  tenant-logs:
  tenant-archive:
  platform-sites:
  platform-logs:
  platform-archive:
  backup-cache:
  tenant-backups:
  tenant-backup-secrets:
  platform-backups:
  platform-backup-secrets:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    file: ${DSHERP_RUNTIME_DIR:-../.runtime}/caddy/Caddyfile
  agent_egress_conf:
    file: ./nginx/agent-egress.conf
  agent_egress_entrypoint:
    file: ./nginx/agent-egress-entrypoint.sh

secrets:
  db_root_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/db_root_password
  backup_repository_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_repository_password
  backup_secrets_repository_password:
    file: ${DSHERP_SECRETS_DIR:-../.runtime/control}/backup_secrets_repository_password
