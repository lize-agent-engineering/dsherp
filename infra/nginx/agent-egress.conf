# The only route out of the internal agent network. Everything except the model
# provider is unreachable, so a run cannot post what it read to another host.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8890;
    server_name _;
    client_max_body_size 8m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Only the provider API surface; no wildcard upstream and no CONNECT tunnel.
    location / {
        set $provider "${DSHERP_PROVIDER_HOST}";
        proxy_pass https://$provider$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name ${DSHERP_PROVIDER_HOST};
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host ${DSHERP_PROVIDER_HOST};
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
