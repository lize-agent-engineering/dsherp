# Replaces the base image snippet of the same path. Versioned here so the policy
# that reaches a browser is reviewable in the repository, not only inside an image.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;
# Business data reaches the model and comes back as Markdown. img-src and connect-src
# are the two channels an injected ERP field could use to exfiltrate what it saw, so
# both are pinned to this origin. Desk itself needs inline and eval for its own scripts.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; connect-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:" always;
