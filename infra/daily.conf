# Daily business Site shares the existing pinned backend process, but has its own
# Frappe Site directory and database. It is not an acceptance-data Site.
map $http_origin $dsherp_daily_origin_allowed {
    default 0;
    "" 1;
    "http://daily.localhost:18086" 1;
}
server {
    listen 8082;
    server_name daily.localhost;
    if ($host != daily.localhost) { return 421; }
    if ($dsherp_daily_origin_allowed = 0) { return 403; }
    root /home/frappe/frappe-bench/sites;
    include /etc/nginx/snippets/security_headers.conf;
    client_max_body_size 50m;
    location /assets { try_files $uri =404; }
    location ~ ^/protected/(.*) {
        internal;
        try_files /dsherp-daily.localhost/$1 =404;
    }
    location /socket.io { return 404; }
    location / {
        try_files /dsherp-daily.localhost/public/$uri @daily;
    }
    location @daily {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name dsherp-daily.localhost;
        proxy_set_header Host $http_host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://backend-server;
    }
}
