name: dsherp-validation

services:
  db:
    image: mariadb@sha256:92e50059ea0a5965a33ef751970eab37d421b91ebbd01ac909039cffe159e574
    pull_policy: never
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.4
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=256M"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes: ["db-data:/var/lib/mysql"]
    networks: [validation]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  redis:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["redis-server", "--maxmemory", "80mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    volumes: ["redis-data:/data"]
    networks: [validation]
    logging: *logging

  backend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 0.6
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18081:8000"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-validation.localhost]
      api:
    logging: *logging

  frontend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    # Assets are linked by backend; avoid mutating the read-only sites mount.
    entrypoint: []
    command: ["nginx-entrypoint.sh"]
    ports: ["127.0.0.1:18082:8080"]
    environment:
      BACKEND: dsherp-validation.localhost:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: dsherp-validation.localhost
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - ./frappe.conf.template:/templates/nginx/frappe.conf.template:ro
    depends_on: [backend, websocket]
    networks: [validation, api]
    logging: *logging

  websocket:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: "no"
    entrypoint: []
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: ["sites:/home/frappe/frappe-bench/sites:ro"]
    depends_on: [redis]
    networks: [validation]
    logging: *logging

  worker:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 0.6
    restart: "no"
    command: ["bench", "worker", "--queue", "short,default,long"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  scheduler:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["bench", "schedule"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

networks:
  validation:
    internal: true
  api:

volumes:
  sites:
  logs:
  db-data:
  redis-data:

secrets:
  db_root_password:
    file: ../.runtime/control/db_root_password
