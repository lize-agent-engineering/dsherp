name: dsherp-validation

services:
  db:
    image: mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    pull_policy: never
    # One MariaDB serves every Site, and its memory grows with the tables it keeps open:
    # six schemas hold 3516 tables and table_open_cache saturates at 2000 (measured 2026-09-07).
    # The two throwaway native-test Sites added 1003 of those tables to a limit chosen for four
    # Sites, and the container was killed twice with 137. Every buffer with a large image
    # default is named here rather than allocated behind the limit's back: the MyISAM key cache
    # and the Aria page cache default to 128M each and this workload measured 21 KiB and 208 KiB
    # of use against 18 MyISAM tables holding 2.5 MB.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 0.4
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=256M", "--key-buffer-size=32M", "--aria-pagecache-buffer-size=32M"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes: ["v16-db-data:/var/lib/mysql"]
    networks: [validation]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  redis:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["redis-server", "--maxmemory", "80mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    volumes: ["v16-redis-data:/data"]
    networks: [validation]
    logging: *logging

  backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    # Reserve 384 MiB / 0.1 CPU for the single on-demand Agent container.
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18081:8000"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - v16-backups:/home/frappe/backups
      - v16-backup-secrets:/home/frappe/backup-secrets
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-validation.localhost]
      api:
      agent:
    logging: *logging

  frontend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    # Assets are linked by backend; avoid mutating the read-only sites mount.
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18082:8080", "127.0.0.1:18085:8081", "127.0.0.1:18086:8082"]
    environment:
      BACKEND: dsherp-validation.localhost:8000
      # Context Agent uses authenticated HTTP polling; no realtime process is required.
      SOCKETIO: dsherp-validation.localhost:8000
      FRAPPE_SITE_NAME_HEADER: dsherp-validation.localhost
      DSHERP_PUBLIC_ORIGIN: http://127.0.0.1:18082
      DSHERP_SECONDARY_ORIGIN: http://localhost:18082
      DSHERP_CANONICAL_ORIGIN: http://dsherp-validation.localhost:18082
      DSHERP_ACCEPTANCE_ORIGIN: http://agent-source.localhost:18082
      DSHERP_ALLOWED_HOSTS: "127[.]0[.]0[.]1|localhost|dsherp-validation[.]localhost|agent-source[.]localhost"
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites:ro
      - v16-beta-sites:/home/frappe/frappe-bench/beta-sites:ro
      - ./preview.conf:/opt/dsherp-preview.conf:ro
      - ./daily.conf:/opt/dsherp-daily.conf:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security_headers.conf:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [backend, beta-backend]
    networks: [validation, api]
    logging: *logging

  scheduler:
    # Profiled cold-period scheduler; 128 MiB OOMed during its first real tick.
    profiles: [scheduled]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: "unless-stopped"
    command: ["bench", "schedule"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  scheduler-worker:
    # Scheduler only enqueues; this single profiled worker executes its jobs.
    profiles: [scheduled]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.2
    restart: "unless-stopped"
    command: ["bench", "worker", "--queue", "short,default,long"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  daily-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["python", "/opt/provision_daily_site.py"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets: [db_root_password, daily_admin_password]
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_daily_site.py:/opt/provision_daily_site.py:ro
      - ./verify_daily_backup.py:/opt/verify_daily_backup.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  validation-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/provision_validation_site.py"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets: [db_root_password, validation_admin_password]
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_validation_site.py:/opt/provision_validation_site.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  # bench run-tests truncates tables, so the Frappe-native tests get their own throwaway Sites
  # on the benches that already serve the development ones. Each provisioner sees only its own
  # bench's sites volume and only the two passwords it needs.
  test-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/provision_test_site.py", "bridge"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets: [db_root_password, test_admin_password]
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_test_site.py:/opt/provision_test_site.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  platform-test-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/provision_test_site.py", "platform"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets: [db_root_password, test_admin_password]
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites
      - v16-platform-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_test_site.py:/opt/provision_test_site.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  # provision_identity.py 只读 /run/dsherp-control/ 下的两个文件；用密钥的绝对 target 精确给这两个，
  # 不整目录挂载（那会把 backup/daily/admin 五个口令一并交给一次性容器）。
  platform-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/provision_identity.py", "platform"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets:
      - source: db_root_password
        target: /run/dsherp-control/db_root_password
      - source: platform_admin_password
        target: /run/dsherp-control/platform_admin_password
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites
      - v16-platform-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_identity.py:/opt/provision_identity.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  beta-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["/home/frappe/frappe-bench/env/bin/python", "/opt/provision_identity.py", "beta"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets:
      - source: db_root_password
        target: /run/dsherp-control/db_root_password
      - source: beta_admin_password
        target: /run/dsherp-control/beta_admin_password
    volumes:
      - v16-beta-sites:/home/frappe/frappe-bench/sites
      - v16-beta-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_identity.py:/opt/provision_identity.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  platform-backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.15
    restart: "no"
    command: ["start.sh"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites
      - v16-platform-logs:/home/frappe/frappe-bench/logs
      - v16-platform-backups:/home/frappe/backups
      - v16-platform-backup-secrets:/home/frappe/backup-secrets
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-platform.localhost]
    logging: *logging

  beta-backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.25
    restart: "no"
    command: ["start.sh"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - v16-beta-sites:/home/frappe/frappe-bench/sites
      - v16-beta-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks: [validation]
    logging: *logging

  agent-egress:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.1
    restart: "unless-stopped"
    entrypoint: []
    command: ["sh", "/opt/dsherp-agent-egress-entrypoint.sh"]
    environment:
      DSHERP_PROVIDER_HOST: ${DSHERP_PROVIDER_HOST:-api.deepseek.com}
    volumes:
      - ./nginx/agent-egress.conf:/opt/dsherp-agent-egress.conf:ro
      - ./nginx/agent-egress-entrypoint.sh:/opt/dsherp-agent-egress-entrypoint.sh:ro
    networks: [agent, egress]
    logging: *logging

  platform-frontend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: "no"
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18083:8080"]
    environment:
      BACKEND: dsherp-platform.localhost:8000
      SOCKETIO: dsherp-platform.localhost:8000
      FRAPPE_SITE_NAME_HEADER: dsherp-platform.localhost
      DSHERP_PUBLIC_ORIGIN: http://platform.localhost:18083
      DSHERP_SECONDARY_ORIGIN: http://platform.localhost
      DSHERP_CANONICAL_ORIGIN: http://dsherp-platform.localhost:18083
      DSHERP_ACCEPTANCE_ORIGIN: http://agent-platform.localhost:18083
      DSHERP_ALLOWED_HOSTS: "platform[.]localhost|agent-platform[.]localhost"
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security_headers.conf:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [platform-backend]
    networks: [validation, api]
    logging: *logging

  # The same one-shot shape production uses, so a drill exercises the real chain: two
  # repositories, two passwords, two storage identities, each container seeing one half.
  backup-sync-data:
    profiles: [ops]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    # Capabilities are dropped, so root inside the container no longer bypasses file
    # permissions: it has to be the bench user that owns the staged sets (0700).
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    # 运维自备的对象存储凭据：配了异地仓库才需要（admin.doctor 的 PROVIDED_SECRETS 就是
    # 这条判据）。没配的机器上它本就不存在，而 compose 会在**解析**阶段就为缺文件报错，
    # 于是 `dev_stack down` 这种带 scheduled/ops profile 的命令在每台干净机器上必失败——
    # 每夜从零的 runner 正是这种机器，拆栈那步因此红掉，而 216 条集成测试全是绿的。
    env_file:
      - path: ../.runtime/control/backup_storage_credentials
        required: false
    secrets: [backup_repository_password]
    volumes:
      - v16-backups:/backups/tenant:ro
      - v16-platform-backups:/backups/platform:ro
      - v16-backup-cache:/cache
    networks: [validation]
    logging: *logging

  backup-sync-secrets:
    profiles: [ops]
    image: restic/restic:0.18.0@sha256:4cf4a61ef9786f4de53e9de8c8f5c040f33830eb0a10bf3d614410ee2fcb6120
    restart: "no"
    entrypoint: ["restic"]
    # Capabilities are dropped, so root inside the container no longer bypasses file
    # permissions: it has to be the bench user that owns the staged sets (0700).
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RESTIC_REPOSITORY: ${DSHERP_BACKUP_SECRETS_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/backup_secrets_repository_password
      RESTIC_CACHE_DIR: /cache
      TMPDIR: /cache
    # 运维自备的对象存储凭据：配了异地仓库才需要（admin.doctor 的 PROVIDED_SECRETS 就是
    # 这条判据）。没配的机器上它本就不存在，而 compose 会在**解析**阶段就为缺文件报错，
    # 于是 `dev_stack down` 这种带 scheduled/ops profile 的命令在每台干净机器上必失败——
    # 每夜从零的 runner 正是这种机器，拆栈那步因此红掉，而 216 条集成测试全是绿的。
    env_file:
      - path: ../.runtime/control/backup_secrets_storage_credentials
        required: false
    secrets: [backup_secrets_repository_password]
    volumes:
      - v16-backup-secrets:/backups/tenant:ro
      - v16-platform-backup-secrets:/backups/platform:ro
      - v16-backup-cache:/cache
    networks: [validation]
    logging: *logging

networks:
  validation:
    internal: true
  api:
  # Run containers live here and nowhere else: no route to the Internet and no
  # route to the control-plane front ends, only the business backend and the proxy.
  agent:
    internal: true
  egress:

volumes:
  v16-backup-cache:
  v16-backups:
  v16-backup-secrets:
  v16-platform-backups:
  v16-platform-backup-secrets:
  v16-sites:
  v16-logs:
  v16-db-data:
  v16-redis-data:
  v16-platform-sites:
  v16-platform-logs:
  v16-beta-sites:
  v16-beta-logs:

secrets:
  db_root_password:
    file: ../.runtime/control/db_root_password
  backup_repository_password:
    file: ../.runtime/control/backup_repository_password
  backup_secrets_repository_password:
    file: ../.runtime/control/backup_secrets_repository_password
  daily_admin_password:
    file: ../.runtime/control/daily_admin_password
  validation_admin_password:
    file: ../.runtime/control/admin_password
  platform_admin_password:
    file: ../.runtime/control/platform_admin_password
  beta_admin_password:
    file: ../.runtime/control/beta_admin_password
  test_admin_password:
    file: ../.runtime/control/test_admin_password
