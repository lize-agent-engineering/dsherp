name: dsherp-validation

services:
  db:
    image: mariadb@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    pull_policy: never
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.4
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=256M"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes: ["v16-db-data:/var/lib/mysql"]
    networks: [validation]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  redis:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["redis-server", "--maxmemory", "80mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    volumes: ["v16-redis-data:/data"]
    networks: [validation]
    logging: *logging

  backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    # Reserve 384 MiB / 0.1 CPU for the single on-demand Agent container.
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18081:8000"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-validation.localhost]
      api:
    logging: *logging

  frontend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    # Assets are linked by backend; avoid mutating the read-only sites mount.
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18082:8080", "127.0.0.1:18085:8081", "127.0.0.1:18086:8082"]
    environment:
      BACKEND: dsherp-validation.localhost:8000
      # Context Agent uses authenticated HTTP polling; no realtime process is required.
      SOCKETIO: dsherp-validation.localhost:8000
      FRAPPE_SITE_NAME_HEADER: dsherp-validation.localhost
      DSHERP_PUBLIC_ORIGIN: http://127.0.0.1:18082
      DSHERP_SECONDARY_ORIGIN: http://localhost:18082
      DSHERP_CANONICAL_ORIGIN: http://dsherp-validation.localhost:18082
      DSHERP_ACCEPTANCE_ORIGIN: http://agent-source.localhost:18082
      DSHERP_ALLOWED_HOSTS: "127[.]0[.]0[.]1|localhost|dsherp-validation[.]localhost|agent-source[.]localhost"
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites:ro
      - v16-beta-sites:/home/frappe/frappe-bench/beta-sites:ro
      - ./preview.conf:/opt/dsherp-preview.conf:ro
      - ./daily.conf:/opt/dsherp-daily.conf:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [backend, beta-backend]
    networks: [validation, api]
    logging: *logging

  scheduler:
    # Not needed for synthetic acceptance; reserve its budget for preview Desk.
    profiles: [scheduled]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["bench", "schedule"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  daily-provision:
    profiles: [control]
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    entrypoint: []
    command: ["python", "/opt/provision_daily_site.py"]
    environment: {PYTHONPATH: /opt/dsherp-frappe}
    secrets: [db_root_password, daily_admin_password]
    volumes:
      - v16-sites:/home/frappe/frappe-bench/sites
      - v16-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
      - ./provision_daily_site.py:/opt/provision_daily_site.py:ro
      - ./verify_daily_backup.py:/opt/verify_daily_backup.py:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  platform-backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.15
    restart: "no"
    command: ["start.sh"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites
      - v16-platform-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-platform.localhost]
    logging: *logging

  beta-backend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.25
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18084:8000"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - v16-beta-sites:/home/frappe/frappe-bench/sites
      - v16-beta-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    # Synthetic preview has no external route; ingress goes through nginx.
    networks: [validation]
    logging: *logging

  platform-frontend:
    image: frappe/erpnext@sha256:493cecf82c92c828bf0d0c57df60694e07dc61671e374ac93a070d1cc86df1bd
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: "no"
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18083:8080"]
    environment:
      BACKEND: dsherp-platform.localhost:8000
      SOCKETIO: dsherp-platform.localhost:8000
      FRAPPE_SITE_NAME_HEADER: dsherp-platform.localhost
      DSHERP_PUBLIC_ORIGIN: http://platform.localhost:18083
      DSHERP_SECONDARY_ORIGIN: http://platform.localhost
      DSHERP_CANONICAL_ORIGIN: http://dsherp-platform.localhost:18083
      DSHERP_ACCEPTANCE_ORIGIN: http://agent-platform.localhost:18083
      DSHERP_ALLOWED_HOSTS: "platform[.]localhost|agent-platform[.]localhost"
    volumes:
      - v16-platform-sites:/home/frappe/frappe-bench/sites:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [platform-backend]
    networks: [validation, api]
    logging: *logging

networks:
  validation:
    internal: true
  api:

volumes:
  v16-sites:
  v16-logs:
  v16-db-data:
  v16-redis-data:
  v16-platform-sites:
  v16-platform-logs:
  v16-beta-sites:
  v16-beta-logs:

secrets:
  db_root_password:
    file: ../.runtime/control/db_root_password
  daily_admin_password:
    file: ../.runtime/control/daily_admin_password
