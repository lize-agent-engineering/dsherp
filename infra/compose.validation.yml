name: dsherp-validation

services:
  db:
    image: mariadb@sha256:92e50059ea0a5965a33ef751970eab37d421b91ebbd01ac909039cffe159e574
    pull_policy: never
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.4
    restart: "no"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-buffer-pool-size=256M"]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes: ["db-data:/var/lib/mysql"]
    networks: [validation]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  redis:
    image: redis@sha256:d0c875bdacfb5c4d2c2d9124de3f53cee1dc9ceff8936bd459fabc135cb33015
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["redis-server", "--maxmemory", "80mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    volumes: ["redis-data:/data"]
    networks: [validation]
    logging: *logging

  backend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    # Reserve 384 MiB / 0.1 CPU for the single on-demand Agent container.
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.5
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18081:8000"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-validation.localhost]
      api:
    logging: *logging

  frontend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    # Assets are linked by backend; avoid mutating the read-only sites mount.
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18082:8080", "127.0.0.1:18085:8081"]
    environment:
      BACKEND: dsherp-validation.localhost:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: dsherp-validation.localhost
      DSHERP_PUBLIC_ORIGIN: http://127.0.0.1:18082
      DSHERP_SECONDARY_ORIGIN: http://localhost:18082
      DSHERP_CANONICAL_ORIGIN: http://dsherp-validation.localhost:18082
      DSHERP_ALLOWED_HOSTS: "127[.]0[.]0[.]1|localhost|dsherp-validation[.]localhost"
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - beta-sites:/home/frappe/frappe-bench/beta-sites:ro
      - ./preview.conf:/opt/dsherp-preview.conf:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [backend, websocket, beta-backend]
    networks: [validation, api]
    logging: *logging

  websocket:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.1
    restart: "no"
    entrypoint: []
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: ["sites:/home/frappe/frappe-bench/sites:ro"]
    depends_on: [redis]
    networks: [validation]
    logging: *logging

  worker:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.15
    restart: "no"
    command: ["bench", "worker", "--queue", "short,default,long"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  scheduler:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    command: ["bench", "schedule"]
    environment:
      PYTHONPATH: /opt/dsherp-frappe
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    depends_on: [db, redis]
    networks: [validation]
    logging: *logging

  platform-backend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.15
    restart: "no"
    command: ["start.sh"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites
      - platform-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    networks:
      validation:
        aliases: [dsherp-platform.localhost]
    logging: *logging

  beta-backend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.15
    restart: "no"
    command: ["start.sh"]
    ports: ["127.0.0.1:18084:8000"]
    environment: {PYTHONPATH: /opt/dsherp-frappe, GUNICORN_WORKERS: "1", GUNICORN_THREADS: "2"}
    volumes:
      - beta-sites:/home/frappe/frappe-bench/sites
      - beta-logs:/home/frappe/frappe-bench/logs
      - ../frappe_app:/opt/dsherp-frappe:ro
    # Synthetic preview has no external route; ingress goes through nginx.
    networks: [validation]
    logging: *logging

  platform-websocket:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.1
    restart: "no"
    entrypoint: []
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: ["platform-sites:/home/frappe/frappe-bench/sites:ro"]
    networks: [validation]
    logging: *logging

  platform-frontend:
    image: frappe/erpnext@sha256:cf5905396635aa2ee91722237e489bf0ab848819c521d094703852f154cdb341
    pull_policy: never
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.05
    restart: "no"
    entrypoint: []
    command: ["sh", "/opt/nginx-validation.sh"]
    ports: ["127.0.0.1:18083:8080"]
    environment:
      BACKEND: dsherp-platform.localhost:8000
      SOCKETIO: platform-websocket:9000
      FRAPPE_SITE_NAME_HEADER: dsherp-platform.localhost
      DSHERP_PUBLIC_ORIGIN: http://platform.localhost:18083
      DSHERP_SECONDARY_ORIGIN: http://platform.localhost
      DSHERP_CANONICAL_ORIGIN: http://dsherp-platform.localhost:18083
      DSHERP_ALLOWED_HOSTS: "platform[.]localhost"
    volumes:
      - platform-sites:/home/frappe/frappe-bench/sites:ro
      - ./frappe.conf.template:/opt/dsherp-frappe.conf.template:ro
      - ./nginx-validation.sh:/opt/nginx-validation.sh:ro
      - ../frappe_app/dsherp_bridge/public:/home/frappe/frappe-bench/assets/dsherp_bridge:ro
    depends_on: [platform-backend, platform-websocket]
    networks: [validation, api]
    logging: *logging

networks:
  validation:
    internal: true
  api:

volumes:
  sites:
  logs:
  db-data:
  redis-data:
  platform-sites:
  platform-logs:
  beta-sites:
  beta-logs:

secrets:
  db_root_password:
    file: ../.runtime/control/db_root_password
