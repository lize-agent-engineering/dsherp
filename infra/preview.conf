# Reuse the existing nginx process and pinned assets; beta has its own files/DB.
map $http_origin $dsherp_preview_origin_allowed {
    default 0;
    "" 1;
    "http://preview.localhost:18085" 1;
}
server {
    listen 8081;
    server_name preview.localhost;
    if ($host != preview.localhost) { return 421; }
    if ($dsherp_preview_origin_allowed = 0) { return 403; }
    root /home/frappe/frappe-bench/beta-sites;
    include /etc/nginx/snippets/security_headers.conf;
    client_max_body_size 50m;
    location /assets {
        root /home/frappe/frappe-bench/sites;
        try_files $uri =404;
    }
    location ~ ^/protected/(.*) {
        internal;
        try_files /dsherp-beta.localhost/$1 =404;
    }
    # The native boot flag disables async in this isolated preview.
    location /socket.io { return 404; }
    location / {
        try_files /dsherp-beta.localhost/public/$uri @preview;
    }
    location @preview {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name dsherp-beta.localhost;
        proxy_set_header Host $http_host;
        proxy_set_header X-Use-X-Accel-Redirect True;
        proxy_read_timeout 120;
        proxy_redirect off;
        proxy_pass http://beta-backend:8000;
    }
}
